name: Build Ingenic QEMU

on:
  push:
    tags: [ 'ingenic-*' ]
  release:
    types: [ published ]
  workflow_dispatch:

# Build qemu-system-mipsel (Ingenic T-series) for Linux, Windows, macOS.
# Targets only mipsel-softmmu to keep CI fast.
# ccache is enabled and persisted across runs via actions/cache@v5.

env:
  TARGET: mipsel-softmmu
  CCACHE_MAXSIZE: "2G"

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build python3 python3-venv ccache \
            pkg-config libglib2.0-dev libslirp-dev libpixman-1-dev \
            zlib1g-dev libfdt-dev flex bison

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: linux-x86_64-mipsel-${{ github.sha }}
          restore-keys: |
            linux-x86_64-mipsel-

      - name: Configure ccache
        run: |
          ccache --max-size=${{ env.CCACHE_MAXSIZE }}
          ccache -z

      - name: Configure
        run: |
          mkdir build
          cd build
          ../configure \
            --target-list=${{ env.TARGET }} \
            --disable-docs --disable-werror \
            --enable-slirp \
            --cc="ccache cc" --cxx="ccache c++" \
            --prefix=/usr

      - name: Build
        run: ninja -C build qemu-system-mipsel

      - name: ccache stats
        run: ccache -s

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp build/qemu-system-mipsel dist/
          strip dist/qemu-system-mipsel || true
          cp -r contrib/ingenic dist/
          (cd dist && sha256sum qemu-system-mipsel > qemu-system-mipsel.sha256)
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: qemu-system-mipsel-linux-x86_64
          path: dist/

  macos:
    name: macOS (universal-ish)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps
        run: |
          brew update
          brew install ninja pkg-config glib pixman libslirp dtc ccache

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/ccache
          key: macos-mipsel-${{ github.sha }}
          restore-keys: |
            macos-mipsel-

      - name: Configure ccache
        run: |
          ccache --max-size=${{ env.CCACHE_MAXSIZE }}
          ccache -z

      - name: Configure
        run: |
          mkdir build
          cd build
          ../configure \
            --target-list=${{ env.TARGET }} \
            --disable-docs --disable-werror \
            --enable-slirp \
            --cc="ccache cc" --cxx="ccache c++"

      - name: Build
        run: ninja -C build qemu-system-mipsel

      - name: ccache stats
        run: ccache -s

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp build/qemu-system-mipsel dist/
          cp -r contrib/ingenic dist/
          (cd dist && shasum -a 256 qemu-system-mipsel > qemu-system-mipsel.sha256)
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: qemu-system-mipsel-macos
          path: dist/

  windows:
    name: Windows (mingw64 cross from Linux)
    # Cross-compile on Linux: ~3-5x faster than MSYS2 native build on
    # windows-latest, and benefits from Linux-side ccache.
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:43
    steps:
      - name: Install build deps + mingw64 cross toolchain
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git ccache make ninja-build python3 python3-pip \
            bison flex meson diffutils \
            gcc glib2-devel pkgconf-pkg-config \
            mingw64-gcc \
            mingw64-glib2 \
            mingw64-pixman \
            mingw64-pkg-config \
            mingw-w64-tools

      - uses: actions/checkout@v6

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: windows-mingw64-mipsel-${{ github.sha }}
          restore-keys: |
            windows-mingw64-mipsel-

      - name: Configure ccache + cross-compiler wrappers
        run: |
          mkdir -p ~/.cache/ccache
          ccache --max-size=${{ env.CCACHE_MAXSIZE }}
          ccache -z
          # ccache wrappers for the cross compiler so the bulk of the
          # mingw build also gets cached (not just native build-machine
          # helpers).
          mkdir -p /usr/libexec/ccache-wrappers
          for tool in gcc cc g++ c++; do
              ln -sf /usr/bin/ccache /usr/libexec/ccache-wrappers/x86_64-w64-mingw32-$tool
          done

      - name: Configure
        env:
          PATH: /usr/libexec/ccache-wrappers:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
        run: |
          mkdir build
          cd build
          ../configure \
            --target-list=${{ env.TARGET }} \
            --cross-prefix=x86_64-w64-mingw32- \
            --disable-docs --disable-werror \
            --disable-slirp \
            --without-default-features \
            --enable-system \
            --enable-tcg

      - name: Build
        env:
          PATH: /usr/libexec/ccache-wrappers:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
        run: ninja -C build qemu-system-mipsel.exe

      - name: ccache stats
        run: ccache -s

      - name: Stage artifacts (with required DLLs)
        run: |
          mkdir -p dist
          cp build/qemu-system-mipsel.exe dist/
          x86_64-w64-mingw32-strip dist/qemu-system-mipsel.exe || true
          # Bundle MinGW runtime DLLs the binary depends on
          deps=$(x86_64-w64-mingw32-objdump -p build/qemu-system-mipsel.exe \
                  | awk '/DLL Name:/ {print $3}')
          for dll in $deps; do
            for d in /usr/x86_64-w64-mingw32/sys-root/mingw/bin \
                     /usr/x86_64-w64-mingw32/bin; do
              if [ -e "$d/$dll" ]; then
                cp "$d/$dll" dist/
                break
              fi
            done
          done
          cp -r contrib/ingenic dist/
          (cd dist && sha256sum qemu-system-mipsel.exe > qemu-system-mipsel.exe.sha256)
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: qemu-system-mipsel-windows-x86_64
          path: dist/

  release:
    name: Publish release on tag
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/ingenic-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Repackage per-OS bundles
        run: |
          cd artifacts
          for d in qemu-system-mipsel-*; do
            tar -czf "../${d}.tar.gz" -C "$d" .
          done
          cd ..
          ls -la *.tar.gz

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
          fail_on_unmatched_files: false
          generate_release_notes: true
