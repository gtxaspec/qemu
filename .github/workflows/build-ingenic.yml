name: Build Ingenic QEMU

on:
  push:
    tags: [ 'ingenic-*' ]
  release:
    types: [ published ]
  workflow_dispatch:

# Build qemu-system-mipsel (Ingenic T-series) for Linux, Windows, macOS.
# Targets only mipsel-softmmu to keep CI fast.
# ccache is enabled and persisted across runs via actions/cache@v5.

env:
  TARGET: mipsel-softmmu
  CCACHE_MAXSIZE: "2G"

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build python3 python3-venv ccache \
            pkg-config libglib2.0-dev libslirp-dev libpixman-1-dev \
            zlib1g-dev libfdt-dev flex bison

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: linux-x86_64-mipsel-${{ github.sha }}
          restore-keys: |
            linux-x86_64-mipsel-

      - name: Configure ccache
        run: |
          ccache --max-size=${{ env.CCACHE_MAXSIZE }}
          ccache -z

      - name: Configure
        run: |
          mkdir build
          cd build
          ../configure \
            --target-list=${{ env.TARGET }} \
            --disable-docs --disable-werror \
            --enable-slirp \
            --cc="ccache cc" --cxx="ccache c++" \
            --prefix=/usr

      - name: Build
        run: ninja -C build qemu-system-mipsel

      - name: ccache stats
        run: ccache -s

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp build/qemu-system-mipsel dist/
          strip dist/qemu-system-mipsel || true
          cp -r contrib/ingenic dist/
          (cd dist && sha256sum qemu-system-mipsel > qemu-system-mipsel.sha256)
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: qemu-system-mipsel-linux-x86_64
          path: dist/

  macos:
    name: macOS (universal-ish)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps
        run: |
          brew update
          brew install ninja pkg-config glib pixman libslirp dtc ccache

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/ccache
          key: macos-mipsel-${{ github.sha }}
          restore-keys: |
            macos-mipsel-

      - name: Configure ccache
        run: |
          ccache --max-size=${{ env.CCACHE_MAXSIZE }}
          ccache -z

      - name: Configure
        run: |
          mkdir build
          cd build
          ../configure \
            --target-list=${{ env.TARGET }} \
            --disable-docs --disable-werror \
            --enable-slirp \
            --cc="ccache cc" --cxx="ccache c++"

      - name: Build
        run: ninja -C build qemu-system-mipsel

      - name: ccache stats
        run: ccache -s

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp build/qemu-system-mipsel dist/
          cp -r contrib/ingenic dist/
          (cd dist && shasum -a 256 qemu-system-mipsel > qemu-system-mipsel.sha256)
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: qemu-system-mipsel-macos
          path: dist/

  windows:
    name: Windows (MSYS2 mingw64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      # Pin ccache dir to a path both Windows-side actions/cache and the
      # MSYS2 shell can resolve consistently. The workspace path expansion
      # of ~ differs between the two contexts otherwise.
      CCACHE_DIR: D:\ccache
    steps:
      - uses: actions/checkout@v6

      - name: Install MSYS2 + deps
        uses: msys2/setup-msys2@v2.31.1
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            git
            python
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-libslirp
            mingw-w64-x86_64-dtc
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-ccache

      - name: Pre-create ccache dir
        # actions/cache warns if path doesn't exist when saving; create it
        # on the Windows side so the cache is always saved (even on cold runs).
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:CCACHE_DIR | Out-Null

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: D:\ccache
          key: windows-mingw64-mipsel-${{ github.sha }}
          restore-keys: |
            windows-mingw64-mipsel-

      - name: Configure ccache
        run: |
          ccache --max-size=${{ env.CCACHE_MAXSIZE }}
          ccache -z
          ccache --get-config cache_dir

      - name: Configure
        run: |
          mkdir build
          cd build
          ../configure \
            --target-list=${{ env.TARGET }} \
            --disable-docs --disable-werror \
            --enable-slirp \
            --cc="ccache gcc" --cxx="ccache g++"

      - name: Build
        run: ninja -C build qemu-system-mipsel.exe

      - name: ccache stats
        run: ccache -s

      - name: Stage artifacts (with required DLLs)
        run: |
          mkdir -p dist
          cp build/qemu-system-mipsel.exe dist/
          # Bundle MSYS2 mingw64 runtime DLLs the binary needs
          for dll in $(ldd build/qemu-system-mipsel.exe | grep -i '/mingw64/' | awk '{print $3}'); do
            cp "$dll" dist/
          done
          cp -r contrib/ingenic dist/
          (cd dist && sha256sum qemu-system-mipsel.exe > qemu-system-mipsel.exe.sha256)
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: qemu-system-mipsel-windows-x86_64
          path: dist/

  release:
    name: Publish release on tag
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/ingenic-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Repackage per-OS bundles
        run: |
          cd artifacts
          for d in qemu-system-mipsel-*; do
            tar -czf "../${d}.tar.gz" -C "$d" .
          done
          cd ..
          ls -la *.tar.gz

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
          fail_on_unmatched_files: false
          generate_release_notes: true
