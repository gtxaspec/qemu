name: Build Ingenic QEMU

on:
  push:
    tags: [ 'ingenic-*' ]
  release:
    types: [ published ]
  workflow_dispatch:

# Build qemu-system-mipsel (Ingenic T-series) for Linux, Windows, macOS,
# and qemu-system-riscv32 (the SoCs' RISC-V cores, which share memory with
# it over a UNIX socket) for all but Windows.
# ccache is enabled and persisted across runs via actions/cache@v5.

env:
  TARGET: mipsel-softmmu
  TARGETS: mipsel-softmmu,riscv32-softmmu
  CCACHE_MAXSIZE: "2G"

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build python3 python3-venv ccache nasm \
            pkg-config libglib2.0-dev libslirp-dev libpixman-1-dev \
            zlib1g-dev libfdt-dev flex bison libgmp-dev

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: linux-x86_64-mipsel-${{ github.sha }}
          restore-keys: |
            linux-x86_64-mipsel-

      - name: Configure ccache
        run: |
          ccache --max-size=${{ env.CCACHE_MAXSIZE }}
          ccache -z

      - name: Restore FFmpeg
        id: ffmpeg
        uses: actions/cache@v5
        with:
          path: ~/ffmpeg
          key: ffmpeg-linux-x86_64-${{ hashFiles('.github/scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg (static, H.264 and HEVC decoders, for the A1 decoder model)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: sh .github/scripts/build-ffmpeg.sh "$HOME/ffmpeg"

      - name: Configure
        run: |
          mkdir build
          cd build
          PKG_CONFIG_PATH="$HOME/ffmpeg/lib/pkgconfig" ../configure \
            --target-list=${{ env.TARGETS }} \
            --disable-docs --disable-werror \
            --enable-ingenic-vdec-avcodec \
            --enable-slirp \
            --cc="ccache cc" --cxx="ccache c++" \
            --prefix=/usr

      - name: Build
        run: ninja -C build qemu-system-mipsel qemu-system-riscv32 contrib/plugins/libips.so contrib/plugins/libcoherency.so

      - name: ccache stats
        run: ccache -s

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp build/qemu-system-mipsel build/qemu-system-riscv32 dist/
          strip dist/qemu-system-mipsel dist/qemu-system-riscv32 || true
          cp -r contrib/ingenic dist/
          mkdir -p dist/plugins
          cp build/contrib/plugins/libips.so build/contrib/plugins/libcoherency.so dist/plugins/
          (cd dist && sha256sum qemu-system-mipsel > qemu-system-mipsel.sha256 &&
           sha256sum qemu-system-riscv32 > qemu-system-riscv32.sha256)
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: qemu-system-mipsel-linux-x86_64
          path: dist/

  linux-arm64:
    name: Linux (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build python3 python3-venv ccache nasm \
            pkg-config libglib2.0-dev libslirp-dev libpixman-1-dev \
            zlib1g-dev libfdt-dev flex bison libgmp-dev

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: linux-arm64-mipsel-${{ github.sha }}
          restore-keys: |
            linux-arm64-mipsel-

      - name: Configure ccache
        run: |
          ccache --max-size=${{ env.CCACHE_MAXSIZE }}
          ccache -z

      - name: Restore FFmpeg
        id: ffmpeg
        uses: actions/cache@v5
        with:
          path: ~/ffmpeg
          key: ffmpeg-linux-aarch64-${{ hashFiles('.github/scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg (static, H.264 and HEVC decoders, for the A1 decoder model)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: sh .github/scripts/build-ffmpeg.sh "$HOME/ffmpeg"

      - name: Configure
        run: |
          mkdir build
          cd build
          PKG_CONFIG_PATH="$HOME/ffmpeg/lib/pkgconfig" ../configure \
            --target-list=${{ env.TARGETS }} \
            --disable-docs --disable-werror \
            --enable-ingenic-vdec-avcodec \
            --enable-slirp \
            --cc="ccache cc" --cxx="ccache c++" \
            --prefix=/usr

      - name: Build
        run: ninja -C build qemu-system-mipsel qemu-system-riscv32 contrib/plugins/libips.so contrib/plugins/libcoherency.so

      - name: ccache stats
        run: ccache -s

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp build/qemu-system-mipsel build/qemu-system-riscv32 dist/
          strip dist/qemu-system-mipsel dist/qemu-system-riscv32 || true
          cp -r contrib/ingenic dist/
          mkdir -p dist/plugins
          cp build/contrib/plugins/libips.so build/contrib/plugins/libcoherency.so dist/plugins/
          (cd dist && sha256sum qemu-system-mipsel > qemu-system-mipsel.sha256 &&
           sha256sum qemu-system-riscv32 > qemu-system-riscv32.sha256)
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: qemu-system-mipsel-linux-aarch64
          path: dist/

  macos:
    name: macOS (universal-ish)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install build deps
        run: |
          brew update
          brew install ninja pkg-config glib pixman libslirp dtc gmp ccache

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/ccache
          key: macos-mipsel-${{ github.sha }}
          restore-keys: |
            macos-mipsel-

      - name: Configure ccache
        run: |
          ccache --max-size=${{ env.CCACHE_MAXSIZE }}
          ccache -z

      - name: Restore FFmpeg
        id: ffmpeg
        uses: actions/cache@v5
        with:
          path: ~/ffmpeg
          key: ffmpeg-macos-${{ hashFiles('.github/scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg (static, H.264 and HEVC decoders, for the A1 decoder model)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: sh .github/scripts/build-ffmpeg.sh "$HOME/ffmpeg"

      - name: Configure
        run: |
          mkdir build
          cd build
          PKG_CONFIG_PATH="$HOME/ffmpeg/lib/pkgconfig" ../configure \
            --target-list=${{ env.TARGETS }} \
            --disable-docs --disable-werror \
            --enable-ingenic-vdec-avcodec \
            --enable-slirp \
            --cc="ccache cc" --cxx="ccache c++"

      - name: Build
        run: ninja -C build qemu-system-mipsel qemu-system-riscv32

      - name: ccache stats
        run: ccache -s

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp build/qemu-system-mipsel build/qemu-system-riscv32 dist/
          cp -r contrib/ingenic dist/
          (cd dist && shasum -a 256 qemu-system-mipsel > qemu-system-mipsel.sha256 &&
           shasum -a 256 qemu-system-riscv32 > qemu-system-riscv32.sha256)
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: qemu-system-mipsel-macos
          path: dist/

  windows:
    name: Windows (mingw64 cross from Linux)
    # Cross-compile on Linux: ~3-5x faster than MSYS2 native build on
    # windows-latest, and benefits from Linux-side ccache.
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora:43
    steps:
      - name: Install build deps + mingw64 cross toolchain
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git ccache make ninja-build python3 python3-pip nasm xz \
            bison flex meson diffutils \
            gcc glib2-devel pkgconf-pkg-config \
            mingw64-gcc \
            mingw64-glib2 \
            mingw64-pixman \
            mingw64-gmp \
            mingw64-pkg-config \
            mingw-w64-tools

      - uses: actions/checkout@v6

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: windows-mingw64-mipsel-${{ github.sha }}
          restore-keys: |
            windows-mingw64-mipsel-

      - name: Configure ccache + cross-compiler wrappers
        run: |
          mkdir -p ~/.cache/ccache
          ccache --max-size=${{ env.CCACHE_MAXSIZE }}
          ccache -z
          # ccache wrappers for the cross compiler so the bulk of the
          # mingw build also gets cached (not just native build-machine
          # helpers).
          mkdir -p /usr/libexec/ccache-wrappers
          for tool in gcc cc g++ c++; do
              ln -sf /usr/bin/ccache /usr/libexec/ccache-wrappers/x86_64-w64-mingw32-$tool
          done

      - name: Restore FFmpeg
        id: ffmpeg
        uses: actions/cache@v5
        with:
          path: ~/ffmpeg
          key: ffmpeg-windows-x86_64-${{ hashFiles('.github/scripts/build-ffmpeg.sh') }}

      - name: Build FFmpeg (static, H.264 and HEVC decoders, for the A1 decoder model)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: sh .github/scripts/build-ffmpeg.sh "$HOME/ffmpeg" x86_64-w64-mingw32-

      - name: FFmpeg into the mingw sysroot
        # meson ignores PKG_CONFIG_PATH for a cross build's host machine, and
        # the mingw pkg-config prefixes its sysroot to paths outside it
        run: |
          S=/usr/x86_64-w64-mingw32/sys-root/mingw
          cp -r "$HOME"/ffmpeg/include/libavcodec "$HOME"/ffmpeg/include/libavutil "$S"/include/
          cp "$HOME"/ffmpeg/lib/libavcodec.a "$HOME"/ffmpeg/lib/libavutil.a "$S"/lib/
          for f in libavcodec libavutil; do
            sed "s|$HOME/ffmpeg|$S|g" "$HOME/ffmpeg/lib/pkgconfig/$f.pc" > "$S/lib/pkgconfig/$f.pc"
          done

      - name: Configure
        env:
          PATH: /usr/libexec/ccache-wrappers:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
        run: |
          mkdir build
          cd build
          ../configure \
            --target-list=${{ env.TARGET }} \
            --cross-prefix=x86_64-w64-mingw32- \
            --disable-docs --disable-werror \
            --disable-slirp \
            --without-default-features \
            --enable-system \
            --enable-tcg \
            --enable-ingenic-vdec-avcodec

      - name: Build
        env:
          PATH: /usr/libexec/ccache-wrappers:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
        run: ninja -C build qemu-system-mipsel.exe

      - name: ccache stats
        run: ccache -s

      - name: Stage artifacts (with required DLLs)
        run: |
          mkdir -p dist
          cp build/qemu-system-mipsel.exe dist/
          x86_64-w64-mingw32-strip dist/qemu-system-mipsel.exe || true
          # Bundle the MinGW DLLs the binary depends on, and theirs in turn
          # (glib needs libintl and pcre2); Windows' own DLLs are not here
          todo=dist/qemu-system-mipsel.exe
          while [ -n "$todo" ]; do
            next=
            for f in $todo; do
              for dll in $(x86_64-w64-mingw32-objdump -p "$f" \
                           | awk '/DLL Name:/ {print $3}'); do
                [ -e "dist/$dll" ] && continue
                for d in /usr/x86_64-w64-mingw32/sys-root/mingw/bin \
                         /usr/x86_64-w64-mingw32/bin; do
                  if [ -e "$d/$dll" ]; then
                    cp "$d/$dll" dist/
                    next="$next dist/$dll"
                    break
                  fi
                done
              done
            done
            todo=$next
          done
          cp -r contrib/ingenic dist/
          (cd dist && sha256sum qemu-system-mipsel.exe > qemu-system-mipsel.exe.sha256)
          ls -la dist/

      - uses: actions/upload-artifact@v7
        with:
          name: qemu-system-mipsel-windows-x86_64
          path: dist/

  release:
    name: Publish release on tag
    needs: [linux, linux-arm64, macos, windows]
    if: startsWith(github.ref, 'refs/tags/ingenic-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Repackage per-OS bundles
        run: |
          cd artifacts
          for d in qemu-system-mipsel-*; do
            # upload-artifact keeps no file modes: the binaries and the
            # scripts (by their #! line) get their exec bit back here
            chmod +x "$d"/qemu-system-* 2>/dev/null || true
            for f in "$d"/ingenic/*; do
              [ -f "$f" ] && [ "$(head -c 2 "$f")" = '#!' ] && chmod +x "$f"
            done
            tar -czf "../${d}.tar.gz" -C "$d" .
          done
          cd ..
          ls -la *.tar.gz

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            *.tar.gz
          fail_on_unmatched_files: false
          generate_release_notes: true
